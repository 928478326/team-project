name: CI & Checkstyle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-and-checkstyle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run JUnit 5 & Clean Architecture tests (with JaCoCo coverage)
        run: mvn -B test

      - name: Run CSC207 Checkstyle audit (mystyle.xml)
        run: mvn -B checkstyle:check -Dcheckstyle.failOnViolation=false
